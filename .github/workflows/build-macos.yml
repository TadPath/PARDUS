name: Build PARDUS Release Packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which package to build'
        required: true
        default: 'linux-deb'
        type: choice
        options:
          - linux-deb
          - linux-rpm
          - macos
          - all

jobs:
  build-linux-deb:
    if: ${{ inputs.target == 'linux-deb' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libzmq3-dev libsodium-dev libpng-dev libjpeg-dev libfontconfig-dev libpulse-dev libx11-dev dpkg-dev

      - name: Build Debian .deb package
        run: |
          chmod +x linux/build_deb.sh
          ./linux/build_deb.sh

      - name: Upload Linux .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: PARDUS-Linux-amd64-deb
          path: build_deb/*.deb

  build-macos:
    if: ${{ inputs.target == 'macos' || inputs.target == 'all' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies via Homebrew
        run: |
          brew install gtk4 zeromq libsodium libpng jpeg-turbo fontconfig pkg-config dylibbundler

      - name: Build PARDUS.app and PARDUS-macOS.dmg
        run: |
          chmod +x macos/bundle_macos.sh
          ./macos/bundle_macos.sh

      - name: Upload PARDUS-macOS.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: PARDUS-macOS-arm64
          path: build_macos/PARDUS-macOS.dmg

  build-linux-rpm:
    if: ${{ inputs.target == 'linux-rpm' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build gcc pkgconf-pkg-config tar gzip gtk4-devel zeromq-devel libsodium-devel libpng-devel libjpeg-turbo-devel fontconfig-devel pulseaudio-libs-devel libX11-devel

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Fedora .rpm package
        run: |
          chmod +x linux/build_rpm.sh
          ./linux/build_rpm.sh

      - name: Upload Fedora .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: PARDUS-Fedora-x86_64-rpm
          path: build_rpm/*.rpm

